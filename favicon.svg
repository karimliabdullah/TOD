<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F4E3AD"/>
            <stop offset="50%" stop-color="#E5C158"/>
            <stop offset="100%" stop-color="#99751D"/>
        </linearGradient>
    </defs>
    <!-- Outer Ring -->
    <circle cx="100" cy="100" r="94" fill="#0B0B0E" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Inner Decorative Leaves -->
    <path d="M 60 75 C 50 65, 45 80, 62 85 M 58 85 C 48 80, 45 95, 62 95" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
    <path d="M 140 75 C 150 65, 155 80, 138 85 M 142 85 C 152 80, 155 95, 138 95" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>

    <!-- Chef Hat Illustration -->
    <path d="M82,62 C75,62 72,52 82,45 C88,38 112,38 118,45 C128,52 125,62 118,62 C125,65 120,72 115,72 L85,72 C80,72 75,65 82,62 Z" fill="url(#goldGrad)"/>
    <rect x="85" y="73" width="30" height="5" rx="1" fill="url(#goldGrad)"/>
    <path d="M 100,75 L 100,77" stroke="#000" stroke-width="1"/>

    <!-- Pot Illustration -->
    <path d="M85,115 L115,115 C117,115 119,117 119,120 L116,132 C115,136 110,138 100,138 C90,138 85,136 84,132 L81,120 C81,117 83,115 85,115 Z" fill="url(#goldGrad)"/>
    <rect x="83" y="112" width="34" height="3" rx="1" fill="url(#goldGrad)"/>
    <circle cx="100" cy="109" r="2" fill="url(#goldGrad)"/>
