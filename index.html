<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафе Вкус Мечты | Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0B0E;
            --card-bg: rgba(22, 22, 28, 0.75);
            --card-border: rgba(212, 175, 55, 0.15);
            --card-border-hover: rgba(212, 175, 55, 0.45);
            --accent-gold: #E5C158;
            --accent-gold-dark: #B38E2A;
            --pill-bg: #1A1A22;
            --text-main: #EDEDF0;
            --text-muted: #8E8E9A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 60%, rgba(20, 18, 30, 0.5) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        header {
            text-align: center;
            padding: 2.5rem 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Custom SVG Logo Badge styling */
        .logo-wrapper {
            width: 130px;
            height: 130px;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 4px 15px rgba(229, 193, 88, 0.25));
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.03);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #FFFFFF 30%, #F4E3AD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        /* Language Switcher */
        .lang-switcher {
            margin-top: 1.2rem;
            display: inline-flex;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        /* Sticky Navigation Bar */
        .nav-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 14, 0.92);
            backdrop-filter: blur(15px);
            padding: 1rem 0 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 1.5rem;
        }

        .nav-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 0 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        /* Main Grouping Pills */
        .main-pills {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .main-pills::-webkit-scrollbar {
            display: none;
        }

        .main-pill-btn {
            background: var(--pill-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 0.65rem 1.6rem;
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .main-pill-btn.active {
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
        }

        /* Live Search Input */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box svg {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0.8rem 1.2rem 0.8rem 3.2rem;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .search-input::placeholder {
            color: #666675;
        }

        /* Subcategory Filter Pills */
        .sub-pills {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .sub-pills::-webkit-scrollbar {
            display: none;
        }

        .sub-pill-btn {
            background: var(--pill-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .sub-pill-btn.active {
            background: rgba(229, 193, 88, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Container & Grid */
        .container {
            max-width: 950px;
            margin: 2.5rem auto 0;
            padding: 0 1.2rem;
            min-height: 400px;
        }

        .category-section {
            margin-bottom: 4rem;
        }

        .category-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            text-align: center;
            color: #F4E3AD;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        /* Cards Design */
        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.6rem;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            border-color: var(--card-border-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .item-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }

        .item-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--accent-gold);
            white-space: nowrap;
        }

        .item-ingredients {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 300;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .item-footer {
            margin-top: auto;
        }

        .portion-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .portion-options-grid {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .option-chip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .option-chip .opt-portion {
            color: var(--text-muted);
        }

        .option-chip .opt-price {
            color: var(--accent-gold);
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 4rem 1rem;
        }

        /* Footer Section */
        footer {
            margin-top: 5rem;
            background: rgba(15, 15, 20, 0.95);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding: 3.5rem 1.5rem 2.5rem;
        }

        .footer-container {
            max-width: 950px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2.5rem;
            align-items: center;
        }

        .footer-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .footer-logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.3rem;
        }

        .footer-tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-contacts {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-item a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-item a:hover {
            color: var(--accent-gold);
        }

        .footer-item svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-gold);
            flex-shrink: 0;
        }

        .footer-bottom {
            max-width: 950px;
            margin: 2.5rem auto 0;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; }
            .menu-grid { grid-template-columns: 1fr; }
            .category-title { font-size: 2rem; }
            .menu-item { padding: 1.25rem; }
            .footer-container { text-align: center; }
            .footer-brand { align-items: center; }
            .footer-contacts { align-items: center; }
        }
    </style>
</head>

        const restaurantNames = { ru: "Вкус Мечты", az: "Xəyal Dadı", en: "Taste of Dream" };
        const placeholders = {
            ru: "Поиск блюда или напитка...",
            az: "Yemək və ya içki axtarın...",
            en: "Type a dish or drink..."
        };

        let currentLang = 'ru';
        let activeMainCat = 'food';
        let activeSubCat = 'all';
        let searchQuery = '';

        function init() {
            renderMainPills();
            renderSubPills();
            renderMenu();
        }

        function renderMainPills() {
            const container = document.getElementById('main-pills-container');
            container.innerHTML = mainCategories.map(cat => `
                <button class="main-pill-btn ${cat.id === activeMainCat ? 'active' : ''}" onclick="selectMainCat('${cat.id}')">
                    ${cat.name[currentLang]}
                </button>
            `).join('');
        }

        function selectMainCat(catId) {
            activeMainCat = catId;
            activeSubCat = 'all';
            renderMainPills();
            renderSubPills();
            renderMenu();
        }

        function renderSubPills() {
            const container = document.getElementById('sub-pills-container');
            const keys = Object.keys(menuData).filter(k => menuData[k].main_category === activeMainCat);
            
            if (keys.length <= 1) {
                container.style.display = 'none';
                return;
            } else {
                container.style.display = 'flex';
            }

            let allText = { ru: "ВСЕ", az: "HAMISI", en: "ALL" }[currentLang];

            let html = `<button class="sub-pill-btn ${activeSubCat === 'all' ? 'active' : ''}" onclick="selectSubCat('all')">${allText}</button>`;
            
            keys.forEach(k => {
                const subName = menuData[k][`category_${currentLang}`] || menuData[k].category_ru;
                html += `<button class="sub-pill-btn ${activeSubCat === k ? 'active' : ''}" onclick="selectSubCat('${k}')">${subName}</button>`;
            });

            container.innerHTML = html;
        }

        function selectSubCat(subId) {
            activeSubCat = subId;
            renderSubPills();
            renderMenu();
        }

        function handleSearch(val) {
            searchQuery = val.trim().toLowerCase();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            let matchedCount = 0;

            Object.keys(menuData).forEach(catKey => {
                const catData = menuData[catKey];
                
                if (catData.main_category !== activeMainCat) return;
                if (activeSubCat !== 'all' && activeSubCat !== catKey) return;

                const filteredItems = catData.items.filter(item => {
                    const name = (item[`name_${currentLang}`] || item.name_ru).toLowerCase();
                    const desc = (item.description || '').toLowerCase();
                    return name.includes(searchQuery) || desc.includes(searchQuery);
                });

                if (filteredItems.length === 0) return;
                matchedCount += filteredItems.length;

                const catTitle = catData[`category_${currentLang}`] || catData.category_ru;

                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = catTitle;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                filteredItems.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';

                    const itemName = item[`name_${currentLang}`] || item.name_ru;
                    const desc = item.description;

                    let bodyContent = `
                        <div>
                            <div class="item-header">
                                <h3 class="item-name">${itemName}</h3>
                                ${item.price_rub ? `<span class="item-price">${item.price_rub} ₽</span>` : ''}
                            </div>
                            ${desc ? `<p class="item-ingredients">${desc}</p>` : ''}
                        </div>
                    `;

                    let footerContent = '';
                    if (item.portion_options && item.portion_options.length > 0) {
                        let optionsHtml = item.portion_options.map(opt => `
                            <div class="option-chip">
                                <span class="opt-portion">${opt.portion}</span>
                                <span class="opt-price">${opt.price_rub} ₽</span>
                            </div>
                        `).join('');

                        footerContent = `<div class="portion-options-grid">${optionsHtml}</div>`;
                    } else if (item.portion) {
                        footerContent = `<div class="item-footer"><span class="portion-badge">${item.portion}</span></div>`;
                    }

                    itemDiv.innerHTML = bodyContent + footerContent;
                    grid.appendChild(itemDiv);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            if (matchedCount === 0) {
                container.innerHTML = `<div class="no-results">${{ ru: "Ничего не найдено", az: "Məlumat tapılmadı", en: "No items found" }[currentLang]}</div>`;
            }
        }

        function changeLang(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === lang) btn.classList.add('active');
            });

            document.getElementById('restaurant-name').textContent = restaurantNames[currentLang];
            document.getElementById('search-input').placeholder = placeholders[currentLang];

            renderMainPills();
            renderSubPills();
            renderMenu();
        }

        init();
    </script>
