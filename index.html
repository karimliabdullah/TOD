<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафе Вкус Мечты | Menu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0B0E;
            --card-bg: rgba(22, 22, 28, 0.75);
            --card-border: rgba(212, 175, 55, 0.15);
            --card-border-hover: rgba(212, 175, 55, 0.45);
            --accent-gold: #E5C158;
            --accent-gold-dark: #B38E2A;
            --pill-bg: #1A1A22;
            --text-main: #EDEDF0;
            --text-muted: #8E8E9A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 60%, rgba(20, 18, 30, 0.5) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        header {
            text-align: center;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Collapsible header wrapper: animates real content height on scroll
           via the grid-template-rows 1fr -> 0fr trick (no fixed px guessing). */
        .header-collapsible {
            display: grid;
            grid-template-rows: 1fr;
            width: 100%;
            transition: grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-collapsible-inner {
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 0 1rem;
            transition: padding 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
        }

        body.scrolled .header-collapsible {
            grid-template-rows: 0fr;
        }

        body.scrolled .header-collapsible-inner {
            padding: 0 0;
            opacity: 0;
        }

        /* Compact brand + language row inside the sticky nav bar. Collapsed to
           zero height by default; eases open in normal document flow once the
           header scrolls away, so it pushes the tabs down instead of
           floating over them. */
        .compact-bar {
            max-width: 950px;
            margin: 0 auto;
            padding: 0 1.2rem;
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.scrolled .compact-bar {
            grid-template-rows: 1fr;
        }

        .compact-bar-inner {
            overflow: hidden;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease, margin-bottom 0.4s ease;
        }

        body.scrolled .compact-bar-inner {
            opacity: 1;
            margin-bottom: 0.85rem;
        }

        .compact-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .lang-switcher-compact {
            display: inline-flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 3px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .lang-switcher-compact .lang-btn {
            padding: 0.28rem 0.75rem;
            font-size: 0.68rem;
        }

        /* Custom SVG Logo Badge styling */
        .logo-wrapper {
            width: 130px;
            height: 130px;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 4px 15px rgba(229, 193, 88, 0.25));
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.03);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #FFFFFF 30%, #F4E3AD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        /* Language Switcher */
        .lang-switcher {
            margin-top: 1.2rem;
            display: inline-flex;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        /* Sticky Navigation Bar */
        .nav-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 14, 0.92);
            backdrop-filter: blur(15px);
            padding: 1rem 0 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 1.5rem;
        }

        .nav-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 0 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        /* Main Grouping Pills */
        .main-pills {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .main-pills::-webkit-scrollbar {
            display: none;
        }

        .main-pill-btn {
            background: var(--pill-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 0.65rem 1.6rem;
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .main-pill-btn.active {
            background: var(--accent-gold);
            color: #000;
            font-weight: 700;
        }

        /* Live Search Input */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box svg {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0.8rem 1.2rem 0.8rem 3.2rem;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .search-input::placeholder {
            color: #666675;
        }

        /* Subcategory Filter Pills */
        .sub-pills {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .sub-pills::-webkit-scrollbar {
            display: none;
        }

        .sub-pill-btn {
            background: var(--pill-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .sub-pill-btn.active {
            background: rgba(229, 193, 88, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* Container & Grid */
        .container {
            max-width: 950px;
            margin: 2.5rem auto 0;
            padding: 0 1.2rem;
            min-height: 400px;
        }

        .category-section {
            margin-bottom: 4rem;
        }

        .category-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            text-align: center;
            color: #F4E3AD;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        /* Cards Design */
        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .menu-item:hover {
            border-color: var(--card-border-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .item-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(0,0,0,0.3));
        }

        .item-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .menu-item:hover .item-image-wrapper img {
            transform: scale(1.05);
        }

        .item-image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(11,11,14,0.55) 0%, rgba(11,11,14,0) 45%);
            pointer-events: none;
        }

        .item-body {
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .item-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }

        .item-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--accent-gold);
            white-space: nowrap;
        }

        .item-ingredients {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 300;
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .item-footer {
            margin-top: auto;
        }

        .portion-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .portion-options-grid {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .option-chip {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .option-chip .opt-portion {
            color: var(--text-muted);
        }

        .option-chip .opt-price {
            color: var(--accent-gold);
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 4rem 1rem;
        }

        .menu-item {
            cursor: pointer;
        }

        /* Item Detail Bottom Sheet */
        .detail-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(5, 5, 7, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .detail-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .detail-sheet {
            width: 100%;
            max-width: 600px;
            max-height: 92vh;
            overflow-y: auto;
            background: #141419;
            border: 1px solid var(--card-border);
            border-bottom: none;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.55);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .detail-overlay.active .detail-sheet {
            transform: translateY(0);
        }

        .detail-sheet::-webkit-scrollbar {
            width: 0;
        }

        .detail-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 24px 24px 0 0;
            background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(0,0,0,0.3));
        }

        .detail-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .detail-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1.4rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: background 0.2s ease;
        }

        .detail-close-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .detail-body {
            padding: 1.8rem 1.6rem 1.4rem;
        }

        .detail-category {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .detail-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.9rem;
            letter-spacing: 0.5px;
        }

        .detail-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 1.4rem;
        }

        .detail-price-row {
            margin-bottom: 1.2rem;
        }

        .detail-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        #detail-portions {
            margin-bottom: 1.4rem;
        }

        .detail-share-btn {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: none;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.2rem;
            width: 100%;
            cursor: pointer;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
        }

        .detail-share-icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .detail-share-icon-circle svg {
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        /* Footer Section */
        footer {
            margin-top: 5rem;
            background: rgba(15, 15, 20, 0.95);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding: 3.5rem 1.5rem 2.5rem;
        }

        .footer-container {
            max-width: 950px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2.5rem;
            align-items: center;
        }

        .footer-brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .footer-logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 0.3rem;
        }

        .footer-tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-contacts {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-item a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-item a:hover {
            color: var(--accent-gold);
        }

        .footer-item svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-gold);
            flex-shrink: 0;
        }

        .footer-bottom {
            max-width: 950px;
            margin: 2.5rem auto 0;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.4rem; }
            .menu-grid { grid-template-columns: 1fr; }
            .category-title { font-size: 2rem; }
            .menu-item { padding: 1.25rem; }
            .footer-container { text-align: center; }
            .footer-brand { align-items: center; }
            .footer-contacts { align-items: center; }
        }
    </style>
</head>
<body>

    <header>
      <div class="header-collapsible" id="header-collapsible">
        <div class="header-collapsible-inner">
        <!-- Custom Vector Badge Logo matching your sticker design -->
        <div class="logo-wrapper">
            <svg viewBox="0 0 200 200" width="100%" height="100%">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F4E3AD"/>
                        <stop offset="50%" stop-color="#E5C158"/>
                        <stop offset="100%" stop-color="#99751D"/>
                    </linearGradient>
                </defs>
                <!-- Outer Ring -->
                <circle cx="100" cy="100" r="94" fill="rgba(20,20,25,0.8)" stroke="url(#goldGrad)" stroke-width="3"/>
                <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,3"/>
                
                <!-- Inner Decorative Leaves -->
                <path d="M 60 75 C 50 65, 45 80, 62 85 M 58 85 C 48 80, 45 95, 62 95" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
                <path d="M 140 75 C 150 65, 155 80, 138 85 M 142 85 C 152 80, 155 95, 138 95" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>

                <!-- Chef Hat Illustration -->
                <path d="M82,62 C75,62 72,52 82,45 C88,38 112,38 118,45 C128,52 125,62 118,62 C125,65 120,72 115,72 L85,72 C80,72 75,65 82,62 Z" fill="url(#goldGrad)"/>
                <rect x="85" y="73" width="30" height="5" rx="1" fill="url(#goldGrad)"/>
                <path d="M 100,75 L 100,77" stroke="#000" stroke-width="1"/>

                <!-- Pot Illustration -->
                <path d="M85,115 L115,115 C117,115 119,117 119,120 L116,132 C115,136 110,138 100,138 C90,138 85,136 84,132 L81,120 C81,117 83,115 85,115 Z" fill="url(#goldGrad)"/>
                <rect x="83" y="112" width="34" height="3" rx="1" fill="url(#goldGrad)"/>
                <circle cx="100" cy="109" r="2" fill="url(#goldGrad)"/>
                <!-- Pot Handles -->
                <path d="M78,118 C75,118 75,124 78,124" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
                <path d="M122,118 C125,118 125,124 122,124" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>

                <!-- Heart Accents -->
                <path d="M100,67 C100,65 98,64 97,65.5 C96,64 94,65 94,67 C94,69 100,71 100,71 C100,71 106,69 106,67 C106,65 104,64 103,65.5 C102,64 100,65 100,67 Z" fill="#000" transform="scale(0.6) translate(66,35)"/>
                <path d="M100,126 C100,124 98,123 97,124.5 C96,123 94,124 94,126 C94,128 100,130 100,130 C100,130 106,128 106,126 C106,124 104,123 103,124.5 C102,123 100,124 100,126 Z" fill="#000" transform="scale(0.6) translate(66,115)"/>

                <!-- Stars / Sparkles -->
                <polygon points="100,146 102,150 106,150 103,153 104,157 100,154 96,157 97,153 94,150 98,150" fill="url(#goldGrad)"/>
            </svg>
        </div>

        <div class="brand-subtitle">Кафе • Доставка нашего вкуса</div>
        <h1 id="restaurant-name">Вкус Мечты</h1>

        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="changeLang('ru')">RU</button>
            <button class="lang-btn" onclick="changeLang('az')">AZ</button>
            <button class="lang-btn" onclick="changeLang('en')">EN</button>
        </div>
        </div>
      </div>
    </header>

    <!-- Sticky Navigation Layout -->
    <div class="nav-wrapper">
        <!-- Compact brand + language row: collapsed to zero height until the
             header scrolls out of view, then eases open in normal document
             flow so it never overlaps the tabs below it. -->
        <div class="compact-bar" id="compact-bar">
            <div class="compact-bar-inner">

                    { "name_ru": "Кофе (натуральный в зернах)", "name_az": "Qəhvə (dənli)", "name_en": "Bean Coffee", "portion": "1 cup", "price_rub": 130, "image": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Cup_of_coffee_surrounded_by_beans.jpg/500px-Cup_of_coffee_surrounded_by_beans.jpg" }

        const restaurantNames = { ru: "Вкус Мечты", az: "Xəyal Dadı", en: "Taste of Dream" };
        const placeholders = {
            ru: "Поиск блюда или напитка...",
            az: "Yemək və ya içki axtarın...",
            en: "Type a dish or drink..."
        };

        let currentLang = 'ru';
        let activeMainCat = 'food';
        let activeSubCat = 'all';
        let searchQuery = '';

        function init() {
            renderMainPills();
            renderSubPills();
            renderMenu();
        }

        function renderMainPills() {
            const container = document.getElementById('main-pills-container');
            container.innerHTML = mainCategories.map(cat => `
                <button class="main-pill-btn ${cat.id === activeMainCat ? 'active' : ''}" onclick="selectMainCat('${cat.id}')">
                    ${cat.name[currentLang]}
                </button>
            `).join('');
        }

        function selectMainCat(catId) {
            activeMainCat = catId;
            activeSubCat = 'all';
            renderMainPills();
            renderSubPills();
            renderMenu();
        }

        function renderSubPills() {
            const container = document.getElementById('sub-pills-container');
            const keys = Object.keys(menuData).filter(k => menuData[k].main_category === activeMainCat);
            
            if (keys.length <= 1) {
                container.style.display = 'none';
                return;
            } else {
                container.style.display = 'flex';
            }

            let allText = { ru: "ВСЕ", az: "HAMISI", en: "ALL" }[currentLang];

            let html = `<button class="sub-pill-btn ${activeSubCat === 'all' ? 'active' : ''}" onclick="selectSubCat('all')">${allText}</button>`;
            
            keys.forEach(k => {
                const subName = menuData[k][`category_${currentLang}`] || menuData[k].category_ru;
                html += `<button class="sub-pill-btn ${activeSubCat === k ? 'active' : ''}" onclick="selectSubCat('${k}')">${subName}</button>`;
            });

            container.innerHTML = html;
        }

        function selectSubCat(subId) {
            activeSubCat = subId;
            renderSubPills();
            renderMenu();
        }

        // Normalizes text for fuzzy, language-agnostic search:
        // strips Azerbaijani diacritics (ç, ə, ı, ö, ü, ş, ğ) and
        // transliterates Cyrillic to Latin, so "coban" matches
        // both "Çoban salatı" and "Салат «Чобан»".
        function normalizeText(str) {
            if (!str) return '';

            const azMap = { 'ə': 'e', 'ı': 'i', 'ö': 'o', 'ü': 'u', 'ç': 'c', 'ş': 's', 'ğ': 'g' };
            const cyrMap = {
                а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z',
                и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r',
                с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sch',
                ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya'
            };

            let s = str.toLowerCase();
            s = s.split('').map(ch => azMap[ch] ?? ch).join('');
            s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            s = s.split('').map(ch => cyrMap[ch] ?? ch).join('');
            s = s.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
            return s;
        }

        function getSearchableText(item) {
            return normalizeText(
                [item.name_ru, item.name_az, item.name_en, item.description].filter(Boolean).join(' ')
            );
        }

        function handleSearch(val) {
            searchQuery = normalizeText(val);
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            let matchedCount = 0;
            const isSearching = searchQuery.length > 0;

            Object.keys(menuData).forEach(catKey => {
                const catData = menuData[catKey];

                // While searching, look across every category/tab so a match
                // is never hidden behind an unrelated main/sub filter.
                if (!isSearching) {
                    if (catData.main_category !== activeMainCat) return;
                    if (activeSubCat !== 'all' && activeSubCat !== catKey) return;
                }

                const filteredItems = catData.items.filter(item => {
                    if (!isSearching) return true;
                    return getSearchableText(item).includes(searchQuery);
                });

                if (filteredItems.length === 0) return;
                matchedCount += filteredItems.length;

                const catTitle = catData[`category_${currentLang}`] || catData.category_ru;

                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = catTitle;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                filteredItems.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';

                    const itemName = item[`name_${currentLang}`] || item.name_ru;
                    const desc = item.description;

                    let imageContent = item.image ? `
                        <div class="item-image-wrapper">
                            <img src="${item.image}" alt="${itemName}" loading="lazy" onerror="this.parentElement.style.display='none'">
                        </div>
                    ` : '';

                    let bodyContent = `
                        <div>
                            <div class="item-header">
                                <h3 class="item-name">${itemName}</h3>
                                ${item.price_rub ? `<span class="item-price">${item.price_rub} ₽</span>` : ''}
                            </div>
                            ${desc ? `<p class="item-ingredients">${desc}</p>` : ''}
                        </div>
                    `;

                    let footerContent = '';
                    if (item.portion_options && item.portion_options.length > 0) {
                        let optionsHtml = item.portion_options.map(opt => `
                            <div class="option-chip">
                                <span class="opt-portion">${opt.portion}</span>
                                <span class="opt-price">${opt.price_rub} ₽</span>
                            </div>
                        `).join('');

                        footerContent = `<div class="portion-options-grid">${optionsHtml}</div>`;
                    } else if (item.portion) {
                        footerContent = `<div class="item-footer"><span class="portion-badge">${item.portion}</span></div>`;
                    }

                    itemDiv.innerHTML = imageContent + `<div class="item-body">${bodyContent}${footerContent}</div>`;
                    itemDiv.addEventListener('click', () => openItemDetail(item, catKey));
                    grid.appendChild(itemDiv);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });

            if (matchedCount === 0) {
                container.innerHTML = `<div class="no-results">${{ ru: "Ничего не найдено", az: "Məlumat tapılmadı", en: "No items found" }[currentLang]}</div>`;
            }
        }

        function changeLang(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === lang) btn.classList.add('active');
            });

            document.getElementById('restaurant-name').textContent = restaurantNames[currentLang];
            document.getElementById('compact-brand').textContent = restaurantNames[currentLang];
            document.getElementById('search-input').placeholder = placeholders[currentLang];

            renderMainPills();
            renderSubPills();
            renderMenu();

            if (currentDetailItem) renderDetailContent();
        }

        // Item Detail Bottom Sheet
        let currentDetailItem = null;
        let currentDetailCatKey = null;
        const shareLabels = { ru: "Поделиться", az: "Paylaş", en: "Share" };

        function openItemDetail(item, catKey) {
            currentDetailItem = item;
            currentDetailCatKey = catKey;
            renderDetailContent();
            document.getElementById('detail-overlay').classList.add('active');
            document.getElementById('detail-sheet').scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function renderDetailContent() {
            if (!currentDetailItem) return;
            const item = currentDetailItem;
            const catData = menuData[currentDetailCatKey];
            const itemName = item[`name_${currentLang}`] || item.name_ru;
            const desc = item.description;
            const catTitle = catData[`category_${currentLang}`] || catData.category_ru;

            const imgWrapper = document.getElementById('detail-image-wrapper');
            const imgEl = document.getElementById('detail-image');
            if (item.image) {
                imgWrapper.style.display = '';
                imgEl.src = item.image;
                imgEl.alt = itemName;
            } else {
                imgWrapper.style.display = 'none';
            }

            document.getElementById('detail-category').textContent = catTitle;
            document.getElementById('detail-name').textContent = itemName;

            const descEl = document.getElementById('detail-description');
            descEl.textContent = desc || '';
            descEl.style.display = desc ? '' : 'none';

            document.getElementById('detail-price').textContent = item.price_rub ? `${item.price_rub} ₽` : '';

            const portionsContainer = document.getElementById('detail-portions');
            if (item.portion_options && item.portion_options.length > 0) {
                portionsContainer.innerHTML = `<div class="portion-options-grid">${item.portion_options.map(opt => `
                    <div class="option-chip">
                        <span class="opt-portion">${opt.portion}</span>
                        <span class="opt-price">${opt.price_rub} ₽</span>
                    </div>
                `).join('')}</div>`;
            } else if (item.portion) {
                portionsContainer.innerHTML = `<span class="portion-badge">${item.portion}</span>`;
            } else {
                portionsContainer.innerHTML = '';
            }

            document.getElementById('detail-share-label').textContent = shareLabels[currentLang];
        }

        function closeItemDetail() {
            document.getElementById('detail-overlay').classList.remove('active');
            document.body.style.overflow = '';
            currentDetailItem = null;
            currentDetailCatKey = null;
        }

        function closeItemDetailBackdrop(e) {
            if (e.target.id === 'detail-overlay') closeItemDetail();
        }

        function shareItem() {
            if (!currentDetailItem) return;
            const itemName = currentDetailItem[`name_${currentLang}`] || currentDetailItem.name_ru;
            const shareData = {
                title: itemName,
                text: `${itemName} — ${restaurantNames[currentLang]}`,
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareData.url).catch(() => {});
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeItemDetail();
        });

        // Collapse the header into the floating top-right language switcher on scroll.
        const SCROLL_COLLAPSE_THRESHOLD = 60;
        let scrollTicking = false;

        function updateScrolledState() {
            document.body.classList.toggle('scrolled', window.scrollY > SCROLL_COLLAPSE_THRESHOLD);
            scrollTicking = false;
        }

        window.addEventListener('scroll', () => {
            if (!scrollTicking) {
                requestAnimationFrame(updateScrolledState);
                scrollTicking = true;
            }
        }, { passive: true });

        init();
        updateScrolledState();
    </script>
